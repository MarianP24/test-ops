<!DOCTYPE html>
<html lang="en">

<th:block th:replace="~{fragments/head :: head(title='Delete Machine')}"></th:block>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <h1 class="mt-5">Delete Machine</h1>
    <form action="/machines/deleteMachine" method="post">

        <div class="form-group">
            <label for="machineId">Machine ID:</label>
            <input type="number" id="machineId" name="id" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-danger mt-2">Delete Machine</button>

    </form>

    <div th:if="${message}" class="alert alert-success mt-2" th:text="${message}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger mt-2" th:text="${errorMessage}"></div>

</div>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
